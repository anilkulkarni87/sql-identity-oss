apiVersion: v1
kind: Service
metadata:
  name: {{ include "idr-enterprise.fullname" . }}-api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "idr-enterprise.name" . }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 8000
