{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "idr-enterprise.fullname" . }}-keycloak
spec:
  type: {{ .Values.keycloak.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "idr-enterprise.name" . }}
    app.kubernetes.io/component: keycloak
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: 8080
{{- end }}
