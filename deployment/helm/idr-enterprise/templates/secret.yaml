{{- if and .Values.secrets.create (not .Values.secrets.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "idr-enterprise.secretName" . }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.keycloakAdminPassword | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
  IDR_RUN_JOB_WEBHOOK_BEARER_TOKEN: {{ .Values.secrets.runJobWebhookBearerToken | quote }}
{{- end }}
