{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "idr-enterprise.fullname" . }}-grafana
spec:
  type: {{ .Values.grafana.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "idr-enterprise.name" . }}
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: 3000
{{- end }}
