name: idr-mcp
version: 0.1
purpose: Read-only access to IDR outputs (deterministic + fuzzy) for agents.
security:
  pii_access: masked_by_default
  require_roles_for_full_pii: true
  datasets: ["idr_out", "idr_meta"]
  notes:
    - MCP should query views that apply row/column masking.
    - If encrypted PII is used, identifier_value is optional.

resources:
  - idr_out.identity_resolved_membership_current
  - idr_out.identity_clusters_current
  - idr_out.identity_edges_current
  - idr_out.edge_evidence
  - idr_out.run_history
  - idr_out.config_snapshot
  - idr_out.skipped_identifier_groups
  - idr_out.golden_profiles
  - idr_meta.rule
  - idr_meta.source_table

tools:
  - name: get_cluster
    input: { resolved_id: string, include_edges?: boolean, include_entities?: boolean }
    output:
      resolved_id: string
      cluster_size: number
      run_id: string
      super_cluster_id?: string
      entities?: [{ entity_key, resolved_id, run_id, updated_at }]
      edges?: [{ left_entity_key, right_entity_key, identifier_type, identifier_value_norm?, run_id }]
      pii_access_level: "none|masked|full"

  - name: get_golden_profile
    description: Retrieve the resolved golden profile attributes for a cluster (e.g. name, email, phone) based on survivorship rules.
    input: { resolved_id: string }
    output:
      resolved_id: string
      attributes: { first_name?, last_name?, email?, phone?, ... } # Dynamic keys
      pii_access_level: "none|masked|full"

  - name: search_identifier
    input: { value: string, identifier_type?: string, limit?: number }
    output:
      matches: [{ resolved_id, cluster_size, confidence_score? }]
      pii_access_level: "none|masked|full"

  - name: list_edges_for_cluster
    input: { resolved_id: string, limit?: number }
    output:
      edges: [{ left_entity_key, right_entity_key, identifier_type, identifier_value_norm?, run_id }]

  - name: explain_edge
    input: { entity_key_a: string, entity_key_b: string }
    output:
      evidence: [{ rule_id, identifier_type, match_value?, score?, created_at }]
      pii_access_level: "none|masked|full"

  - name: run_history
    input: { limit?: number }
    output:
      runs: [{ run_id, run_mode, status, started_at, ended_at, duration_seconds, config_hash? }]

  - name: latest_run
    input: {}
    output:
      run_id: string
      status: string
      config_hash?: string

  - name: config_snapshot
    input: { config_hash: string }
    output:
      sources_json: string
      rules_json: string
      mappings_json: string

  - name: list_rules
    input: {}
    output:
      rules: [{ rule_id, identifier_type, priority, is_active }]

  - name: list_sources
    input: {}
    output:
      sources: [{ table_id, table_fqn, entity_type, is_active }]

  - name: list_skipped_groups
    input: { limit?: number }
    output:
      skipped_groups: [{ identifier_type, identifier_value_norm, group_size, skip_reason }]

  - name: get_metrics_summary
    input: {}
    output:
      total_clusters: number
      total_entities: number
      total_edges: number
      avg_confidence_score: number

  - name: explain_cluster
    input: { resolved_id: string }
    output:
      resolved_id: string
      cluster_metadata: object
      members: array
      edges: array
      golden_profile: object

  - name: dry_run_pipeline
    input: { run_mode?: string, max_iters?: number }
    output:
      status: string
      dry_run_summary?: object

  - name: discover_and_suggest_rules
    description: Profile warehouse tables, detect PII and identity attributes, and generate recommended YAML configuration.
    input: { table_fqn?: string, sample_size?: number }
    output:
      status: string
      tables_profiled: number
      detected_identifiers: array
      detected_attributes: array
      suggested_config: object

  - name: simulate_rule_impact
    description: Simulate adding or modifying a matching rule against warehouse data without mutating tables.
    input: { rule: object, dialect?: string }
    output:
      status: string
      eligible_entities: number
      simulated_anchor_edges: number
      risk_level: string
      risk_reasons: array

  - name: resolve_customer_360
    description: Single-call Customer 360 context grounding for AI agents and RAG pipelines.
    input: { identifier_value: string, identifier_type?: string }
    output:
      found: boolean
      resolved_id?: string
      golden_profile?: object
      linked_accounts?: array
      known_identifiers?: array
      risk_flags?: array
