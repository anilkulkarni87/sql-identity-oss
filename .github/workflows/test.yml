name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package-smoke:
    name: Package Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/release.lock
          python -m build
          twine check dist/*

      - name: Install from built wheel
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install dist/*.whl
          idr version
          idr quickstart --help
          idr doctor --json

  quickstart-golden-path:
    name: Quickstart Golden Path (<=10m)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock

      - name: Run quickstart timing gate
        run: |
          python tools/ci/validate_quickstart_path.py \
            --max-seconds 600 \
            --rows 10000 \
            --output tmp/quickstart_ci.duckdb \
            --report tmp/quickstart_ci_report.json

      - name: Upload quickstart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickstart-golden-path-${{ github.sha }}
          path: tmp/quickstart_ci_report.json

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock

      - name: Run tests
        run: |
          python -m pytest tests/ --ignore=tests/legacy -v

  mcp-contract:
    name: MCP Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock

      - name: Run MCP contract tests
        run: |
          set -o pipefail
          mkdir -p tmp/test-reports
          python -m pytest \
            tests/test_mcp_contract.py \
            tests/test_mcp_secrets.py \
            tests/test_mcp_errors.py \
            -q \
            --junitxml=tmp/test-reports/mcp-contract-junit.xml | tee tmp/test-reports/mcp-contract.log

      - name: Upload MCP contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-contract-report-${{ github.sha }}
          path: tmp/test-reports/

  ui-lockfile:
    name: UI Lockfile Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate package-lock.json
        run: npm ci --ignore-scripts --no-audit
        working-directory: idr_ui

  ui-unit:
    name: UI Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI dependencies
        run: npm ci --ignore-scripts --no-audit
        working-directory: idr_ui

      - name: Run UI tests with coverage
        run: npm run test
        working-directory: idr_ui

      - name: Upload UI coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-unit-coverage-${{ github.sha }}
          path: idr_ui/coverage/

  ui-e2e:
    name: UI E2E Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI dependencies
        run: npm ci --ignore-scripts --no-audit
        working-directory: idr_ui

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: idr_ui

      - name: Run Playwright smoke suite
        run: npm run test:e2e
        working-directory: idr_ui

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-report-${{ github.sha }}
          path: |
            idr_ui/playwright-report/
            idr_ui/test-results/

  pr-quality-gates:
    name: PR Quality Gates (UI + MCP)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs:
      - mcp-contract
      - ui-unit
      - ui-e2e

    steps:
      - name: Assert MCP and UI gates succeeded
        run: |
          echo "mcp-contract result: ${{ needs.mcp-contract.result }}"
          echo "ui-unit result: ${{ needs.ui-unit.result }}"
          echo "ui-e2e result: ${{ needs.ui-e2e.result }}"

          test "${{ needs.mcp-contract.result }}" = "success"
          test "${{ needs.ui-unit.result }}" = "success"
          test "${{ needs.ui-e2e.result }}" = "success"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock

      - name: Lint with flake8
        run: |
          flake8 idr_core/ idr_api/ tests/ tools/ \
            --max-line-length=120 \
            --exclude='**/legacy/**,**/databricks/**,**/notebooks/**' \
            --ignore=E501,W503,W291,W293,W504,E302,E305,E402,E722,E124,E128,E126,E131,E226,E261,E301,E701,E704,E111,E117,W391,F541,F401,F405,F403,F841,F811
        continue-on-error: true

  validate-ddl:
    name: Validate DDL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DuckDB
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock

      - name: Validate DuckDB DDL
        run: |
          python -c "
          import duckdb
          conn = duckdb.connect(':memory:')
          with open('sql/ddl/duckdb.sql') as f:
              ddl = f.read()
          for stmt in ddl.split(';'):
              if stmt.strip():
                  try:
                      conn.execute(stmt)
                  except Exception as e:
                      print(f'Warning: {e}')
          print('DuckDB DDL validation complete')
          "

  sbom-verify:
    name: SBOM Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/release.lock
          python -m build

      - name: Generate Python artifact SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: sbom-python.spdx.json

      - name: Build API image
        run: docker build -t idr-api:ci -f idr_api/Dockerfile .

      - name: Build UI image
        run: docker build -t idr-ui:ci -f idr_ui/Dockerfile idr_ui

      - name: Generate API image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: idr-api:ci
          format: spdx-json
          output-file: sbom-api.spdx.json

      - name: Generate UI image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: idr-ui:ci
          format: spdx-json
          output-file: sbom-ui.spdx.json

      - name: Verify SBOM structure
        run: |
          for sbom in sbom-python.spdx.json sbom-api.spdx.json sbom-ui.spdx.json; do
            echo "Verifying $sbom"
            jq -e '((.SPDXID // "") | length) > 0 and ((.packages // []) | length) > 0' "$sbom" > /dev/null
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: sbom-*.spdx.json

  enterprise-e2e:
    name: Enterprise Stack E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run enterprise stack verification
        run: bash tools/ci/verify_enterprise_stack.sh docker-compose.enterprise.yml

  enterprise-ha-e2e:
    name: Enterprise HA Stack E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Run enterprise HA stack verification
        env:
          EXPECT_HEALTHY_SERVICES: api-a,api-b,api,redis,keycloak
        run: bash tools/ci/verify_enterprise_stack.sh docker-compose.enterprise.ha.yml

  backup-restore-drill:
    name: Backup Restore Drill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock

      - name: Create synthetic state for drill
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          root = Path("tmp/drill_state")
          root.mkdir(parents=True, exist_ok=True)
          (root / "idr.duckdb").write_bytes(b"idr-demo-state-v1")

          for name in ["idr_run_jobs.sqlite3", "idr_service_auth.sqlite3", "idr_audit.sqlite3"]:
              path = root / name
              conn = sqlite3.connect(path)
              conn.execute("CREATE TABLE sample (id INTEGER PRIMARY KEY, value TEXT)")
              conn.execute("INSERT INTO sample(value) VALUES ('ok')")
              conn.commit()
              conn.close()
          PY

      - name: Run backup restore drill
        run: |
          python tools/ci/run_backup_restore_drill.py \
            --file idr_database=tmp/drill_state/idr.duckdb \
            --file run_jobs=tmp/drill_state/idr_run_jobs.sqlite3 \
            --file service_auth=tmp/drill_state/idr_service_auth.sqlite3 \
            --file audit=tmp/drill_state/idr_audit.sqlite3 \
            --backup-dir tmp/drill_backups \
            --evidence-file tmp/drill_backups/restore_drill_report.json \
            --simulate-incident \
            --max-rto-seconds 60 \
            --max-rpo-bytes 0

      - name: Upload drill artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-drill-${{ github.sha }}
          path: tmp/drill_backups/

  rollback-dryrun:
    name: Rollback Dry Run Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Compose availability
        run: docker compose version

      - name: Validate rollback render
        run: bash tools/ci/validate_prod_rollback.sh 0.5.1 docker-compose.prod.yml .env.example

  secrets-posture:
    name: Secrets Posture Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock

      - name: Validate secrets posture and rotation
        run: python tools/ci/validate_secrets_posture.py

  helm-package:
    name: Helm Package Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deployment/helm/idr-enterprise

      - name: Render chart templates
        run: |
          helm template idr-enterprise deployment/helm/idr-enterprise \
            -f deployment/helm/idr-enterprise/values.example.yaml > /tmp/idr-enterprise-rendered.yaml
          test -s /tmp/idr-enterprise-rendered.yaml

  benchmark-harness:
    name: Scale Benchmark Harness
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock

      - name: Run benchmark harness
        run: |
          python tools/ci/run_scale_benchmarks.py \
            --profiles tools/ci/benchmark_profiles.json \
            --output-dir benchmark_artifacts \
            --run-label ci

      - name: Enforce benchmark SLO thresholds
        run: |
          python tools/ci/check_benchmark_slos.py \
            --benchmark-json benchmark_artifacts/benchmark_metrics_latest.json \
            --thresholds tools/ci/benchmark_slo_thresholds.json \
            --report benchmark_artifacts/benchmark_slo_report.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-metrics-${{ github.sha }}
          path: benchmark_artifacts/
