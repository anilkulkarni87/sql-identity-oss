site_name: SQL Identity Resolution
site_description: Production-grade deterministic identity resolution for DuckDB, Snowflake, BigQuery, and Databricks
site_url: https://anilkulkarni87.github.io/sql-identity-oss/
repo_url: https://github.com/anilkulkarni87/sql-identity-oss
repo_name: sql-identity-oss

exclude_docs: |
  README.md


theme:
  name: material
  icon:
    logo: material/graph-outline
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mermaid2:
      arguments:
        theme: 'default'
        flowchart:
          useMaxWidth: true
          htmlLabels: true
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.inlinehilite
  - admonition
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
    - Overview: 01-overview.md
    - Quickstart: 03-quickstart.md
    - Installation: 02-installation.md
    - Architecture: 18-architecture.md
    - How It Works: 21-how-it-works.md
    - Distribution & Deployment: 27-distribution.md
  - Core Concepts:
    - Matching Algorithm: 19-matching-algorithm.md
    - Data Model: 20-data-model.md
    - Schema & DDL Reference: 08-schema.md
    - Pipeline Stages: 07-pipeline.md
  - Supported Warehouses:
    - Platforms Overview: 06-platforms.md
    - Databricks Testing Guide: DATABRICKS_TESTING_GUIDE.md
    - Sizing & Hardware: 24-sizing.md
    - Scaling Strategies: 25-scaling.md
  - Configuration & Operations:
    - Configuration: 04-configuration.md
    - Production Hardening: 26-production-hardening.md
    - Security & Governance: 16-security.md
    - CI/CD Automation: 15-ci-cd.md
    - Troubleshooting: 14-troubleshooting.md
  - Interfaces & Tooling:
    - CLI Reference: 05-cli.md
    - Web UI: 09-ui.md
    - REST API & Metrics: 10-api.md
    - MCP Server (AI Agents): 11-mcp.md
    - dbt Integration: 12-dbt.md
  - Testing & Benchmarks:
    - Scale Testing: 13-scale-testing.md
    - End-to-End Testing: 17-e2e-testing.md
    - Metrics Reference: 22-metrics.md
    - Benchmarks: 23-benchmarks.md
