site_name: SQL Identity Resolution
site_description: Production-grade deterministic & probabilistic identity resolution for DuckDB, Snowflake, BigQuery, and Databricks
site_url: https://anilkulkarni87.github.io/sql-identity-oss/
repo_url: https://github.com/anilkulkarni87/sql-identity-oss
repo_name: anilkulkarni87/sql-identity-oss

exclude_docs: |
  README.md

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/hub-outline
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mermaid2:
      arguments:
        theme: 'base'
        themeVariables:
          primaryColor: '#1e293b'
          primaryTextColor: '#f8fafc'
          primaryBorderColor: '#38bdf8'
          lineColor: '#64748b'
          secondaryColor: '#0f172a'
          tertiaryColor: '#1e293b'
        flowchart:
          useMaxWidth: true
          htmlLabels: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts & Architecture: concepts-and-architecture.md
  - Algorithm & Graph Engine: algorithm-and-graph-engine.md
  - Configuration & Governance: configuration-and-governance.md
  - Interfaces & dbt: interfaces-and-dbt.md
  - Warehouses & Schema: warehouses-and-schema.md
